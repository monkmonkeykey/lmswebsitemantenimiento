<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luz María Sánchez</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        background: #030405;
        color: #f3f4f6;
      }

      .page {
        min-height: 100vh;
        background-image: linear-gradient(rgba(3, 4, 5, 0.72), rgba(3, 4, 5, 0.88)),
          url("https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80");
        background-size: cover;
        background-position: center;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.1rem 2rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .brand {
        font-weight: 700;
        font-size: 1.5rem;
      }

      .content {
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .card {
        max-width: 760px;
        text-align: center;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 2rem 1.5rem;
        backdrop-filter: blur(2px);
      }

      h1 {
        font-size: clamp(2.2rem, 6vw, 4.3rem);
        line-height: 1.05;
        margin: 0 0 1.1rem;
      }

      p {
        margin: 0;
        font-size: clamp(1rem, 2.6vw, 1.25rem);
        line-height: 1.7;
        color: #d1d5db;
      }

      a {
        color: #f9fafb;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <span class="brand">Luz María Sánchez</span>
      </header>

      <section class="content">
        <article class="card">
          <h1>Luz María Sánchez</h1>
          <p>
            Luz María Sánchez is a transdisciplinary artist working across sound, image, and
            computational media. This website is currently being updated. Contact:
            <a href="mailto:studio@luzmariasanchez.com">studio@luzmariasanchez.com</a>.
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
